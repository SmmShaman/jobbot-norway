# nginx config of the static-sites container (127.0.0.1:3200 on the VPS),
# reached through the cloudflared tunnel b5c0ecc5.

server {
    listen 80;
    server_name job.vitalii.no;
    root /sites/job.vitalii.no/current;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 80;
    server_name promo.job.vitalii.no;
    root /sites/promo.job.vitalii.no/current;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80 default_server;
    return 404;
}
