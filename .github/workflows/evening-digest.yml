name: Evening Digest

on:
  schedule:
    # 18:00 UTC ≈ 20:00 Norway summer time
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install supabase httpx python-dotenv

      - name: Send evening digest
        run: python worker/analyze_worker.py --digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TECH_BOT_TOKEN: ${{ secrets.TELEGRAM_TECH_BOT_TOKEN }}
